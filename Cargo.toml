[workspace]
resolver = "2"
members = ["crates/livi-core", "src-tauri", "plugins/livi-plugin", "xtask"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# Keep debug builds fast enough to analyse real tracks while developing.
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.livi-core]
opt-level = 3
